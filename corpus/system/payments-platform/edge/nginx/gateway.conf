# TLS termination for api-gateway. Traffic to the gateway pods is plain HTTP inside the cluster.
server {
    listen              443 ssl;
    server_name         api.payments.example;

    ssl_certificate     /etc/nginx/tls/gateway.crt;
    ssl_certificate_key /etc/nginx/tls/gateway.key;
    ssl_protocols       TLSv1.2;
    ssl_ciphers         ECDHE-RSA-AES256-GCM-SHA384:AES128-SHA;

    location / {
        proxy_pass http://api-gateway.payments.svc.cluster.local:8080;
    }
}
