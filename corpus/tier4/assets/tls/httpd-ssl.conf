# Apache httpd, mod_ssl: partner API virtual host
Listen 8443

<VirtualHost *:8443>
    ServerName partners.example.internal
    SSLEngine on
    SSLCertificateFile    /etc/httpd/tls/partners.crt
    SSLCertificateKeyFile /etc/httpd/tls/partners.key

    # 2019 baseline, superseded:
    # SSLProtocol all -SSLv2
    # SSLCipherSuite RC4-SHA:HIGH

    SSLProtocol         -all +TLSv1.1 +TLSv1.2
    SSLCipherSuite      ECDHE-RSA-AES256-GCM-SHA384:AES128-SHA:DES-CBC3-SHA
    SSLHonorCipherOrder on
    SSLCompression      off

    ProxyPass        / http://partners-backend:8080/
    ProxyPassReverse / http://partners-backend:8080/
</VirtualHost>
