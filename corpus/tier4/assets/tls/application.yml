spring:
  application:
    name: orders-service

server:
  port: 8443
  ssl:
    enabled: true
    key-store: classpath:orders_keystore.p12
    key-store-type: PKCS12
    key-store-password: ${KEYSTORE_PASSWORD:changeit}
    key-alias: orders
    enabled-protocols: TLSv1.1,TLSv1.2
    ciphers:
      - TLS_RSA_WITH_AES_128_CBC_SHA
      - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384

management:
  endpoints:
    web:
      exposure:
        include: health,info
