# HAProxy edge for the claims API
global
    log stdout format raw local0
    maxconn 4096
    tune.ssl.default-dh-param 1024
    ssl-default-bind-options ssl-min-ver TLSv1.1 no-tls-tickets
    ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:AES256-SHA
    ssl-default-bind-ciphersuites TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256

defaults
    mode http
    timeout connect 5s
    timeout client  30s
    timeout server  30s

frontend claims_https
    bind :443 ssl crt /etc/haproxy/tls/claims.pem alpn h2,http/1.1
    default_backend claims_app

backend claims_app
    server app1 10.20.0.11:8080 check
    server app2 10.20.0.12:8080 check
