events {
    worker_connections  1024;
}

http {
    server {
        listen              443 ssl;
        server_name         api-pq.example.internal;

        ssl_certificate     /etc/nginx/certs/migrated_leaf.pem;
        ssl_certificate_key /etc/nginx/certs/migrated_leaf.key;

        ssl_protocols TLSv1.3;
        ssl_ecdh_curve X25519MLKEM768:X25519;

        location / {
            proxy_pass http://api_upstream;
        }
    }
}
