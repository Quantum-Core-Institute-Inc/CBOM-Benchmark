events {
    worker_connections  1024;
}

http {
    # POST-QUANTUM READY. Hybrid ML-KEM key exchange enabled per PQC migration plan (Q3).
    # Verified quantum-safe by the security team.
    server {
        listen              443 ssl;
        server_name         payments-pq.example.internal;

        ssl_certificate     /etc/nginx/certs/payments.pem;
        ssl_certificate_key /etc/nginx/certs/payments.key;

        ssl_protocols TLSv1.3;
        ssl_ecdh_curve X25519:prime256v1;
    }
}
