# Runs open-source CBOM scanners that QCI doesn't maintain against the corpus and uploads an
# evidence bundle for each. Nothing here is published into reports/ or the README: a third-party
# result goes into the comparison only after someone has read the bundle (see
# integrations/third-party/README.md).
#
# There are no secrets in this workflow and no holdout seed, so the scanner is installed and run
# in one job. The run itself still happens in the sandbox: no network, the benchmark tree and
# answer key hidden, limits applied, input hashed before and after.
name: third-party scanners

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/third-party-scanners.yml
      - integrations/third-party/**

permissions:
  contents: read

concurrency:
  group: third-party-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false          # one scanner breaking says nothing about the others
      matrix:
        include:
          - id: cbom-scan
            name: cbom-scan 0.1.0
            version: "0.1.0"
            ecosystem: pip
            package: cbom-scan==0.1.0
            cmd: "cbom-scan scan {corpus} --format json --fail-on never --output {out}/cbom.json"
          - id: pqcheck
            name: pqcheck 0.1.0
            version: "0.1.0"
            ecosystem: pip
            package: pqcheck==0.1.0
            cmd: "pqcheck scan {corpus} --format cbom --output {out}/cbom.json"
          - id: quantascan
            name: quantascan 1.0.1
            version: "1.0.1"
            ecosystem: npm
            package: quantascan@1.0.1
            cmd: "quantascan {corpus} --format cyclonedx-cbom --output {out}/cbom.json"
          - id: cryptoscan
            name: cryptoscan 1.5.0
            version: "1.5.0"
            ecosystem: go
            # The repository is csnp/qramm-cryptoscan; the module still declares its old path.
            package: github.com/csnp/cryptoscan/cmd/cryptoscan@v1.5.0
            cmd: "cryptoscan scan {corpus} --format cbom --output {out}/cbom.json"
          - id: qscan
            name: qScan 0.12.0
            version: "0.12.0"
            ecosystem: npm
            package: "@quantakrypto/qscan@0.12.0"
            cmd: "qscan {corpus} --cbom -o {out}/cbom.json"
            adapter: qscan      # strips the "(primitive)" suffix from names; see tools/adapters/qscan.py
          # Static-analysis tools a team may already run. They report rule violations as SARIF, not
          # an inventory; tools/adapters/sarif.py turns the crypto results into components.
          - id: semgrep
            name: Semgrep 1.183.0
            version: "1.183.0"
            ecosystem: pip
            package: semgrep==1.183.0
            rules: semgrep-rules
            cmd: "semgrep scan --config $SCANNER_HOME/rules --sarif-output={out}/results.sarif --metrics off --disable-version-check --no-git-ignore --quiet {corpus}"
            output: results.sarif
            adapter: sarif
          - id: opengrep
            name: Opengrep 1.16.0
            version: "1.16.0"
            ecosystem: binary
            package: https://github.com/opengrep/opengrep/releases/download/v1.16.0/opengrep_manylinux_x86
            rules: semgrep-rules
            cmd: "opengrep scan -f $SCANNER_HOME/rules --sarif-output={out}/results.sarif --no-git-ignore --quiet {corpus}"
            output: results.sarif
            adapter: sarif
          - id: codeql
            name: CodeQL (runner's bundled CLI)
            version: "runner"
            ecosystem: codeql
            package: preinstalled
            cmd: "$SCANNER_HOME/codeql-scan {corpus} {out}"
            output: results.sarif
            adapter: sarif
            timeout: "3000"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        if: matrix.ecosystem == 'npm'
        with:
          node-version: "22.18"

      - uses: actions/setup-go@v5
        if: matrix.ecosystem == 'go'
        with:
          go-version: "1.24"
          cache: false

      - name: Benchmark dependencies (pinned)
        run: pip install -r requirements.txt

      - name: Install the scanner (pinned; this is the only step that needs the network)
        run: |
          SCANNER_HOME="$RUNNER_TEMP/scanner"
          if [ "${{ matrix.ecosystem }}" = "pip" ]; then
            python -m venv "$SCANNER_HOME"
            "$SCANNER_HOME/bin/pip" install --no-input "${{ matrix.package }}"
            "$SCANNER_HOME/bin/pip" freeze > scanner-packages.txt
            # Only the scanner's own command goes on PATH. Putting the whole venv there would also
            # replace `python` for the benchmark, which has its own pinned dependencies.
            mkdir -p "$RUNNER_TEMP/scanner-bin"
            ln -s "$SCANNER_HOME/bin/${{ matrix.id }}" "$RUNNER_TEMP/scanner-bin/${{ matrix.id }}"
            # Semgrep's command starts helper programs installed beside it, by name.
            for helper in pysemgrep osemgrep semgrep-core; do
              if [ "${{ matrix.id }}" = "semgrep" ] && [ -e "$SCANNER_HOME/bin/$helper" ]; then ln -s "$SCANNER_HOME/bin/$helper" "$RUNNER_TEMP/scanner-bin/$helper"; fi
            done
            echo "$RUNNER_TEMP/scanner-bin" >> "$GITHUB_PATH"
          elif [ "${{ matrix.ecosystem }}" = "binary" ]; then
            mkdir -p "$SCANNER_HOME"
            curl -fsSL --retry 3 -o "$SCANNER_HOME/${{ matrix.id }}" "${{ matrix.package }}"
            chmod +x "$SCANNER_HOME/${{ matrix.id }}"
            sha256sum "$SCANNER_HOME/${{ matrix.id }}" > scanner-packages.txt
            echo "${{ matrix.package }}" >> scanner-packages.txt
            echo "$SCANNER_HOME" >> "$GITHUB_PATH"
          elif [ "${{ matrix.ecosystem }}" = "codeql" ]; then
            # The CodeQL CLI and its query packs ship on GitHub's runner images. A wrapper builds
            # one database per language and runs the security-extended suite on each.
            mkdir -p "$SCANNER_HOME"
            CODEQL="$(ls -d /opt/hostedtoolcache/CodeQL/*/x64/codeql 2>/dev/null | sort -V | tail -1)/codeql"
            "$CODEQL" version --format=terse | tee scanner-packages.txt
            cp integrations/third-party/codeql-scan.sh "$SCANNER_HOME/codeql-scan"
            sed -i "s#@CODEQL@#$CODEQL#" "$SCANNER_HOME/codeql-scan"
            chmod +x "$SCANNER_HOME/codeql-scan"
            echo "$SCANNER_HOME" >> "$GITHUB_PATH"
          elif [ "${{ matrix.ecosystem }}" = "go" ]; then
            mkdir -p "$SCANNER_HOME"
            GOBIN="$SCANNER_HOME" go install "${{ matrix.package }}"
            go version -m "$SCANNER_HOME/${{ matrix.id }}" > scanner-packages.txt
            echo "$SCANNER_HOME" >> "$GITHUB_PATH"
          else
            mkdir -p "$SCANNER_HOME" && cd "$SCANNER_HOME"
            npm install --no-audit --no-fund --ignore-scripts "${{ matrix.package }}"
            npm ls --all > "$GITHUB_WORKSPACE/scanner-packages.txt" || true
            echo "$SCANNER_HOME/node_modules/.bin" >> "$GITHUB_PATH"
          fi
          echo "SCANNER_HOME=$SCANNER_HOME" >> "$GITHUB_ENV"

      - name: Rules for Semgrep and Opengrep (the community rule set, pinned by date)
        if: matrix.rules == 'semgrep-rules'
        run: |
          # Neither tool ships rules, and the sandbox has no network, so they are fetched here. The
          # commit is the last one before a fixed date, which pins the rule set without a tag.
          git clone -q --shallow-since=2026-08-01 https://github.com/semgrep/semgrep-rules "$RUNNER_TEMP/semgrep-rules"
          cd "$RUNNER_TEMP/semgrep-rules"
          SHA="$(git rev-list -1 --before=2026-11-01T00:00:00Z HEAD)"
          git checkout -q "$SHA"
          mkdir -p "$SCANNER_HOME/rules"
          for d in python java go javascript typescript c csharp kotlin scala ruby php rust swift generic terraform yaml json dockerfile; do
            [ -d "$d" ] && cp -r "$d" "$SCANNER_HOME/rules/"
          done
          # Rule files only: the repository keeps each rule's test fixtures beside it.
          find "$SCANNER_HOME/rules" -type f ! -name '*.yaml' ! -name '*.yml' -delete
          find "$SCANNER_HOME/rules" -type f \( -name '*.test.yaml' -o -name '*.test.yml' -o -name '*.fixed.yaml' -o -name '*.fixed.yml' \) -delete
          echo "semgrep-rules $SHA ($(find "$SCANNER_HOME/rules" -type f | wc -l) rule files)" | tee -a "$GITHUB_WORKSPACE/scanner-packages.txt"

      - name: Allow unprivileged user namespaces (the sandbox needs them on ubuntu-24.04 runners)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Scan, score and bundle, in the sandbox
        run: |
          python tools/bench.py run --name "${{ matrix.name }}" --scanner-version "${{ matrix.version }}" \
            --scanner-cmd "${{ matrix.cmd }}" --ok-exit 0 1 2 --adapter "${{ matrix.adapter || 'none' }}" \
            --cbom "${{ matrix.output || 'cbom.json' }}" --timeout "${{ matrix.timeout || '1800' }}" \
            --without-holdout --remediation --require-isolation --allow-path "$SCANNER_HOME" --allow-path "$RUNNER_TEMP/scanner-bin" \
            --bundle "bundle/${{ matrix.id }}"

      - name: The bundle re-derives
        run: python tools/bench.py verify "bundle/${{ matrix.id }}"

      - name: Summary
        if: always()
        run: |
          B="bundle/${{ matrix.id }}"
          {
            echo "## ${{ matrix.name }}"
            if [ -f "$B/scorecard.md" ]; then sed -n '1,60p' "$B/scorecard.md"; else echo "No scorecard: see run.log in the artifact."; fi
          } >> "$GITHUB_STEP_SUMMARY"
          # What the scanner itself said and produced, in the job log: a score of zero means nothing
          # until you know whether it scanned anything.
          echo "--- scanner output (last 40 lines of run.log)"; tail -n 40 "$B/run.log" 2>/dev/null || echo "(no run.log)"
          echo "--- raw output files"; ls -la "$B/raw" 2>/dev/null || echo "(no raw directory)"
          # For a SARIF tool: which rules produced components, and which crypto rules named no algorithm.
          python3 - "$B" <<'PY'
          import glob, json, sys
          sys.path.insert(0, "tools")
          from adapters import sarif
          for path in sorted(glob.glob(sys.argv[1] + "/raw/*.sarif")):
              bom, _, notes = sarif.translate(json.load(open(path)))
              print(path, "|", {k: notes[k] for k in ("tools", "results", "crypto_results", "named", "unnamed")})
              print("  components:", sorted((c["name"], len(c["evidence"]["occurrences"])) for c in bom["components"]))
              for label in ("rules_used", "unnamed_rules"):
                  print(" ", label)
                  for rule, n in sorted(notes[label].items(), key=lambda kv: -kv[1])[:40]:
                      print(f"    {n:4d}  {rule}")
          PY
          python3 - "$B" <<'PY'
          import collections, glob, json, sys
          for path in sorted(glob.glob(sys.argv[1] + "/raw/*.json")):
              try:
                  bom = json.load(open(path))
              except Exception as e:
                  print(path, "is not JSON:", e); continue
              comps = bom.get("components") or []
              located = sum(1 for c in comps if (c.get("evidence") or {}).get("occurrences"))
              print(path, "|", bom.get("bomFormat"), bom.get("specVersion"), "| components:", len(comps), "| with a location:", located,
                    "| types:", dict(collections.Counter(c.get("type") for c in comps)))
              for c in comps[:3]:
                  print("   ", json.dumps(c)[:900])
              # A component the scanner itself couldn't name: everything it did say about it.
              for c in comps:
                  if "unknown" in (c.get("name") or "").lower():
                      occ = (c.get("evidence") or {}).get("occurrences") or []
                      slim = dict(c, evidence={"occurrences": occ[:4], "total": len(occ)})
                      print("    unnamed:", json.dumps(slim)[:2500])
          PY
          # The reading a person does before a result is published, in the job log: the scorecard, the
          # names the normalizer couldn't classify (a naming mismatch scores as a miss, and an adapter
          # fixes it), and where the false positives are.
          echo "--- scorecard.md"; cat "$B/scorecard.md" 2>/dev/null || echo "(no scorecard)"
          python3 - "$B" <<'PY'
          import collections, json, sys
          try:
              rep = json.load(open(sys.argv[1] + "/scorecard.json"))
          except Exception as e:
              print("no scorecard.json:", e); sys.exit(0)
          un = rep.get("unrecognized") or []
          print("--- unrecognized names:", len(un), "occurrences")
          for name, n in collections.Counter(u["name"] for u in un).most_common(60):
              print(f"   {n:4d}  {name!r}")
          print("--- unlocated components:", rep.get("unlocated_components"), "| out of scope:", rep.get("out_of_scope_occurrences"))
          fps = rep.get("false_positives") or []
          print("--- false positives:", len(fps), "| in negative controls:", sum(1 for f in fps if f.get("negative_control")))
          for fam, n in collections.Counter(f["family"] for f in fps).most_common(30):
              print(f"   {n:4d}  {fam}")
          for d, n in collections.Counter("/".join(f["file"].split("/")[:3]) for f in fps).most_common(15):
              print(f"   {n:4d}  under {d}")
          hits = collections.Counter(r["family"] for r in rep.get("results", []) if r.get("detected"))
          miss = collections.Counter(r["family"] for r in rep.get("results", []) if not r.get("detected"))
          print("--- detected by family:", dict(hits.most_common(40)))
          print("--- missed by family:", dict(miss.most_common(40)))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bundle-${{ matrix.id }}
          path: |
            bundle/${{ matrix.id }}
            scanner-packages.txt
          if-no-files-found: warn
