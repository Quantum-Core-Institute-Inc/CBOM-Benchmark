# Verifies the testbench itself on every push and pull request. (The scanner-side workflow that
# runs a scanner against the testbench is integrations/qci-pqc/github-workflow.yml.)
#
# A green run means: every corpus case executed (no skips), the answer key and the generated
# corpora are reproducible from source, every regression suite passes, the answer key replays to
# 100%, and the published tables match the release scorecards.
name: testbench

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"        # the corpus ships Python 3.13 bytecode, and the strict check runs it
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: C toolchain and OpenSSL 3 headers
        run: sudo apt-get update && sudo apt-get install -y build-essential libssl-dev

      - name: Python dependencies (pinned)
        run: pip install -r requirements-verify.txt

      - name: Let the sandbox create namespaces (Ubuntu 24.04 restricts unprivileged user namespaces)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: An image for the sandbox's container lane tests
        run: |
          docker pull -q python:3.13-slim-bookworm
          echo "CBOM_TEST_SCANNER_IMAGE=python:3.13-slim-bookworm" >> "$GITHUB_ENV"

      # The same list of required checks the release workflow runs inside the image:
      # strict corpus run, reproducible answer key and generated corpora, every regression suite
      # (the sandbox suite with --strict), a 100% reference replay, and the docs check.
      - name: Required checks
        run: python tools/bench.py checks --out checks.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checks
          path: checks.json

  # The harness itself supports Python 3.11+. This job proves the floor without the corpus run.
  harness-floor:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Compile and run the suites that don't need the language toolchains
        run: |
          set -e
          python -m py_compile tools/*.py tools/adapters/*.py
          for t in normalize scorer policy gates compare libraries linkage sandbox qci_adapter cdxgen_adapter; do
            python "tools/test_$t.py"
          done
