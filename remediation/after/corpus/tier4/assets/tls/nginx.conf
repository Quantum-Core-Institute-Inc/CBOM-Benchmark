user  nginx;
worker_processes  auto;

events {
    worker_connections  1024;
}

http {
    server {
        listen              443 ssl;
        server_name         portal.example.internal;

        ssl_certificate     /etc/nginx/certs/portal_fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/portal.key;

        # Old settings, kept for reference during the 2023 audit. Not active.
        # ssl_protocols SSLv3 TLSv1;
        # ssl_ciphers RC4-SHA:EXP-DES-CBC-SHA;

        # Migrated (ticket SEC-2207): TLS 1.0/1.1, 3DES and RSA key transport removed; hybrid PQ key exchange first.
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-RSA-AES128-GCM-SHA256;
        ssl_ecdh_curve      X25519MLKEM768:X25519;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;

        location / {
            proxy_pass http://portal_upstream;
        }
    }
}
